name: Deployment Verification

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.promoted
  deployment_status:

permissions:
  contents: read

concurrency:
  group: deployment-verification-${{ github.event.client_payload.url || github.event.deployment_status.target_url || github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_VERCEL_TEAM_ID: team_bseTA2AuCO6A2fCOVY9ubrJo
  CANONICAL_VERCEL_PROJECT_ID: prj_L3ZMoQ79YLx9G2o6Lg9OubqO9H8m
  CANONICAL_VERCEL_STATUS_CONTEXT: Vercel – website
  CANONICAL_PREVIEW_HOST_PATTERN: website-*.vercel.app

jobs:
  smoke:
    name: Verify Vercel Routes
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve canonical verification target
        id: target
        shell: bash
        env:
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          DISPATCH_SHA: ${{ github.event.client_payload.git.sha || github.event.client_payload.sha }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DISPATCH_TYPE: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && "$DISPATCH_TYPE" == "vercel.deployment.promoted" ]]; then
            deployment_url="$DISPATCH_URL"
            smoke_url="https://www.skysthelimitpaintingllc.com"
            deploy_sha="$DISPATCH_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            deployment_url="$DISPATCH_URL"
            smoke_url="$DISPATCH_URL"
            deploy_sha="$DISPATCH_SHA"
          else
            deployment_url="${DEPLOYMENT_TARGET_URL:-$DEPLOYMENT_ENVIRONMENT_URL}"
            smoke_url="$deployment_url"
            deploy_sha="$DEPLOYMENT_SHA"
          fi

          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "::error::Vercel did not provide a valid immutable HTTPS deployment URL"
            exit 1
          fi
          if [[ ! "$smoke_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "::error::Smoke target is not a valid HTTPS URL"
            exit 1
          fi
          if [[ ! "$deploy_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Deployment event did not provide an exact 40-character Git SHA"
            exit 1
          fi

          deployment_host="${deployment_url#https://}"
          deployment_host="${deployment_host%%/*}"
          case "$deployment_host" in
            website-*.vercel.app|www.skysthelimitpaintingllc.com|skysthelimitpaintingllc.com) ;;
            *)
              echo "::error::Deployment is not from the canonical website project host family"
              exit 1
              ;;
          esac

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'smoke_url=%s\n' "$smoke_url" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment verification"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Team: $CANONICAL_VERCEL_TEAM_ID"
            echo "- Project: $CANONICAL_VERCEL_PROJECT_ID"
            echo "- Status context: $CANONICAL_VERCEL_STATUS_CONTEXT"
            echo "- Deployment: $deployment_url"
            echo "- Smoke target: $smoke_url"
            echo "- Commit: $deploy_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify exact canonical Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.CANONICAL_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.CANONICAL_VERCEL_TEAM_ID }}
          DEPLOYMENT_SHA: ${{ steps.target.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
        run: node scripts/verify-vercel-deployment.mjs --sha "$DEPLOYMENT_SHA" --url "$DEPLOYMENT_URL" --timeout 540

      - name: Smoke-test customer routes
        env:
          SITE_URL: ${{ steps.target.outputs.smoke_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:site
