name: Deployment Verification

on:
  repository_dispatch:
    types:
      - vercel.deployment.promoted
  deployment_status:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify Vercel Routes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'vercel.deployment.promoted') ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Resolve approved production target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          site_url='https://www.skysthelimitpaintingllc.com'
          echo "url=$site_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment verification"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Target: $site_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test customer routes
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:site
