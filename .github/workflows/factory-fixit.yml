name: Factory Fix-It Engine

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ['CI/CD Pipeline', 'Quality Gate']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage-and-remediate:
    name: Factory Remediation Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check PR Mergeability and CI Status
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Resolve PR number from workflow_run event if applicable
            PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No active Pull Request identified for this run."
            echo "needs_remediation=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Evaluating PR #$PR_NUMBER..."
          PR_DATA=$(gh pr view "$PR_NUMBER" --json mergeable,headRefName,baseRefName,title)
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.baseRefName')

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

          # Check if merge conflict exists or workflow_run failed
          if [ "$MERGEABLE" = "CONFLICTING" ] || [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            echo "needs_remediation=true" >> "$GITHUB_OUTPUT"
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "reason=merge_conflict" >> "$GITHUB_OUTPUT"
            else
              echo "reason=ci_failure" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "needs_remediation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch to Eve Software Factory
        if: steps.triage.outputs.needs_remediation == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.triage.outputs.pr_number }}
          REASON: ${{ steps.triage.outputs.reason }}
          BRANCH: ${{ steps.triage.outputs.head_branch }}
        run: |
          echo "Dispatching PR #$PR_NUM to Eve Software Factory (Reason: $REASON)..."
          
          # Add factory label to engage Eve Factory pipeline
          gh pr edit "$PR_NUM" --add-label "factory" || true

          # Post orienting comment for the Factory Fix-It Engine
          if [ "$REASON" = "merge_conflict" ]; then
            COMMENT_BODY="🤖 **Eve Software Factory Fix-It Engine Activated**\n\n- **Issue:** Merge conflicts detected on branch \`$BRANCH\` against \`main\`.\n- **Action:** Factory 4-station pipeline dispatched (Classifier ➔ Analyst ➔ Implementer ➔ Reviewer) to resolve conflicts and re-verify tests."
          else
            COMMENT_BODY="🤖 **Eve Software Factory Fix-It Engine Activated**\n\n- **Issue:** CI Quality Gate failure detected on branch \`$BRANCH\`.\n- **Action:** Factory 4-station pipeline dispatched to diagnose failure traces, apply surgical fixes, and restore green status."
          fi

          gh pr comment "$PR_NUM" --body "$COMMENT_BODY" || true
