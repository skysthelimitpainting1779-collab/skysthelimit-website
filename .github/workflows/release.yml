name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Confirm a production deployment from the selected ref
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Production Quality Gate
    if: github.event_name == 'push' || inputs.deploy_production == true
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  delivery-acceptance:
    name: Delivery Acceptance Gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted: ${{ steps.accept.outputs.accepted }}
      decision_sha: ${{ steps.accept.outputs.decision_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record acceptance decision
        id: accept
        run: |
          decision_sha="$(git rev-parse HEAD)"
          accepted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          actor="${{ github.actor }}"
          trigger="${{ github.event_name }}"
          ref="${{ github.ref }}"

          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "decision_sha=$decision_sha" >> "$GITHUB_OUTPUT"

          cat > acceptance-decision.json <<EOF
          {
            "gate": "delivery-acceptance",
            "accepted": true,
            "commit": "$decision_sha",
            "ref": "$ref",
            "actor": "$actor",
            "trigger": "$trigger",
            "accepted_at": "$accepted_at",
            "quality_gate": "passed",
            "policy": "docs/DEPLOYMENT.md"
          }
          EOF
          echo "::notice::Delivery acceptance recorded for $decision_sha by $actor"

      - name: Upload acceptance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-acceptance-decision
          path: acceptance-decision.json
          retention-days: 90

  deploy-production:
    name: Deploy Production
    needs: [quality, delivery-acceptance]
    if: needs.delivery-acceptance.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: skysthelimitpainting1779-4125s-projects
      VERCEL_PROJECT_ID: prj_5c5JVhNGSVrpawy6jbe6htppNLDb
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify production credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Verify release tag is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production artifact
        id: deploy
        run: |
          deployment_url="$(npx vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url"

      - name: Verify live production site health
        run: npm run smoke:site

  create-release:
    name: Create GitHub Release
    needs: deploy-production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
