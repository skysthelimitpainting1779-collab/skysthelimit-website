name: Auto-Merge Verified PRs

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    name: Arm Safe Auto-Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Auto-Merge for Dependabot and Factory PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR context."
            exit 0
          fi

          IS_DEPENDABOT=$([ "$ACTOR" = "dependabot[bot]" ] && echo "true" || echo "false")
          IS_FACTORY=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[] | select(.name=="factory") | .name')

          if [ "$IS_DEPENDABOT" = "true" ] || [ -n "$IS_FACTORY" ]; then
            echo "Arming auto-merge for PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --auto --squash || echo "Auto-merge already armed or requires approval."
          fi
