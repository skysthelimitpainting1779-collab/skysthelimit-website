name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:javascript-typescript'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  npm-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit all locked dependencies
        # Gate: npm audit --audit-level=high, with one documented exception.
        # Accepted residual (recorded 2026-10-12): GHSA-vfj7-8cjw-p6xm
        # (braces stack-exhaustion DoS, reachable via build tooling) has no
        # fixed version — braces is unmaintained at 3.0.3 and the advisory
        # flags every release. Any other high/critical advisory fails the gate.
        run: |
          node -e "
          const { execSync } = require('node:child_process');
          const ALLOWLIST = new Set(['GHSA-vfj7-8cjw-p6xm']);
          let out = '';
          try {
            out = execSync('npm audit --audit-level=high --json', { encoding: 'utf8', maxBuffer: 128 * 1024 * 1024 });
            console.log('npm audit clean — gate passes.');
            process.exit(0);
          } catch (e) { out = String(e.stdout || ''); }
          const audit = JSON.parse(out);
          const flagged = new Map();
          for (const vuln of Object.values(audit.vulnerabilities || {})) {
            if (!['high', 'critical'].includes(vuln.severity)) continue;
            for (const via of vuln.via || []) {
              if (via && typeof via === 'object' && via.url) {
                const m = String(via.url).match(/GHSA-[a-z0-9-]+/i);
                const id = m ? m[0] : via.url;
                if (!ALLOWLIST.has(id)) flagged.set(id, via.title || vuln.name);
              }
            }
          }
          if (flagged.size === 0) {
            console.log('Only the documented braces residual remains — gate passes.');
            process.exit(0);
          }
          console.error('Failing high/critical advisories:');
          for (const [id, title] of flagged) console.error(' - ' + id + ': ' + title);
          process.exit(1);
          "
